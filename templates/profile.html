{% extends 'base.html' %}

{% block title %} 프로필 {% endblock %}

{% block content %}

    <h1>{{ owner.username }}</h1>
    <p>게시물 {{ posts | length }} 개</p>

    <!--내가 내 자신을 팔로우 할 수 없도록 if 처리-->
    {% if user.id != owner.id %}
    <form action="/users/{{owner.username}}/follows" method="post">
        <input type="submit" value="팔로우">
    </form>
    {% endif %}
    <hr>

    {% for post in posts %}
    <p>
        <a href="/posts/{{post.id}}">{{post.content}}</a>
        <small>{{post.create_at}}</small>
    </p>
    {% endfor %}

{% endblock %}
